<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="384" y2="384">
      <stop offset="0%" stop-color="#e6249a"/>
      <stop offset="100%" stop-color="#6b5bf0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="384" height="384" rx="192" ry="192" fill="#0d0d1a"/>
  <circle cx="192" cy="192" r="178" fill="none" stroke="url(#grad)" stroke-width="14"/>

  <!-- Row 1: 3 dots -->
  <line x1="118" y1="128" x2="266" y2="128" stroke="url(#grad)" stroke-width="7"/>
  <circle cx="118" cy="128" r="14" fill="url(#grad)"/>
  <circle cx="192" cy="128" r="14" fill="url(#grad)"/>
  <circle cx="266" cy="128" r="14" fill="url(#grad)"/>

  <!-- Row 2: 3 dots, shorter, centered -->
  <line x1="141" y1="192" x2="243" y2="192" stroke="url(#grad)" stroke-width="7"/>
  <circle cx="141" cy="192" r="14" fill="url(#grad)"/>
  <circle cx="192" cy="192" r="14" fill="url(#grad)"/>
  <circle cx="243" cy="192" r="14" fill="url(#grad)"/>

  <!-- Row 3: 5 dots, longest -->
  <line x1="94" y1="262" x2="290" y2="262" stroke="url(#grad)" stroke-width="7"/>
  <circle cx="94" cy="262" r="14" fill="url(#grad)"/>
  <circle cx="143" cy="262" r="14" fill="url(#grad)"/>
  <circle cx="192" cy="262" r="14" fill="url(#grad)"/>
  <circle cx="241" cy="262" r="14" fill="url(#grad)"/>
  <circle cx="290" cy="262" r="14" fill="url(#grad)"/>
</svg>
